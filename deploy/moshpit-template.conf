# Installed as /etc/moshpit/templates/mums.flower.conf on dev3. setup-origin.sh (and the daily
# renewal, which re-runs it) writes the nginx block for the name from this file instead of the
# static default, substituting the upper-case placeholder below. Both ports serve the app: no CA
# issues for a Moshpit ending, so plain HTTP must work for clients without the pin (the pit.world
# relay, curl, stock browsers).
upstream mums_flower { server 127.0.0.1:8811; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name NAME NAME.pit.world;
    access_log /var/log/nginx/NAME.access.log;
    error_log  /var/log/nginx/NAME.error.log warn;
    client_max_body_size 64k;
    location / {
        proxy_pass http://mums_flower;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name NAME;
    ssl_certificate     /etc/ssl/moshpit/NAME.crt;
    ssl_certificate_key /etc/ssl/moshpit/NAME.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;
    access_log /var/log/nginx/NAME.access.log;
    error_log  /var/log/nginx/NAME.error.log warn;
    client_max_body_size 64k;
    location / {
        proxy_pass http://mums_flower;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
